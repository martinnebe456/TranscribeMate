name: Path-Gated CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: path-gated-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      linux_packaging: ${{ steps.filter.outputs.linux_packaging }}
      docs_contract: ${{ steps.filter.outputs.docs_contract }}
      lint: ${{ steps.filter.outputs.lint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'transcribemate/**'
              - 'tests/**'
              - 'requirements*.txt'
              - 'scripts/shared/run_v2_backend.py'
              - 'scripts/run_v2_backend.ps1'
              - 'scripts/run_v2_backend.sh'
              - 'scripts/bootstrap_runtime.ps1'
              - 'scripts/bootstrap_runtime.sh'
              - 'scripts/windows/run_v2_backend.ps1'
              - 'scripts/windows/bootstrap_runtime.ps1'
              - 'scripts/macos/run_v2_backend.sh'
              - 'scripts/macos/bootstrap_runtime.sh'
              - 'scripts/macos/test_all.sh'
              - 'scripts/linux/**'
            frontend:
              - 'javafx-client/**'
              - 'scripts/run_v2_frontend.ps1'
              - 'scripts/run_v2_frontend.sh'
              - 'scripts/build_v2_release.ps1'
              - 'scripts/build_v2_release_linux.sh'
              - 'scripts/build_v2_release_macos.sh'
              - 'scripts/test_all_macos.sh'
              - 'scripts/windows/run_v2_frontend.ps1'
              - 'scripts/windows/build_v2_release.ps1'
              - 'scripts/windows/setup_build_and_run.ps1'
              - 'scripts/macos/run_v2_frontend.sh'
              - 'scripts/macos/build_v2_release.sh'
              - 'scripts/macos/test_all.sh'
              - 'scripts/linux/**'
            linux_packaging:
              - 'javafx-client/**'
              - 'transcribemate/**'
              - 'requirements*.txt'
              - 'scripts/build_v2_release_linux.sh'
              - 'scripts/run_v2_backend.sh'
              - 'scripts/run_v2_frontend.sh'
              - 'scripts/bootstrap_runtime.sh'
              - 'scripts/linux/**'
            docs_contract:
              - 'docs/**'
              - 'README.md'
              - 'AGENTS.md'
              - 'config.example.json'
              - 'docs/v2/protocol.md'
              - 'docs/v2/protocol.schema.json'
              - 'transcribemate/v2/backend/protocol.py'
              - 'tests/test_v2_protocol.py'
            lint:
              - '**/*.py'
              - '**/*.ps1'
              - '**/*.sh'
              - 'version.txt'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml

  linux_packaging:
    needs: changes
    if: needs.changes.outputs.linux_packaging == 'true'
    uses: ./.github/workflows/ci-linux-packaging.yml

  docs_and_contract:
    needs: changes
    if: needs.changes.outputs.docs_contract == 'true'
    uses: ./.github/workflows/docs-and-contract.yml

  lint_and_sanity:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    uses: ./.github/workflows/lint-and-sanity.yml

  no_relevant_changes:
    needs: changes
    if: |
      needs.changes.outputs.backend != 'true' &&
      needs.changes.outputs.frontend != 'true' &&
      needs.changes.outputs.linux_packaging != 'true' &&
      needs.changes.outputs.docs_contract != 'true' &&
      needs.changes.outputs.lint != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant file changes detected. Skipping component workflows."
