name: Nightly Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  backend_tests:
    uses: ./.github/workflows/ci-backend.yml

  frontend_build:
    uses: ./.github/workflows/ci-frontend.yml

  stdio_smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Stdio ping/shutdown smoke test
        shell: pwsh
        run: |
          $script = @'
          import json
          import subprocess
          import sys

          proc = subprocess.Popen(
              [sys.executable, "-m", "transcribemate.v2.backend.server", "--stdio"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              encoding="utf-8",
          )

          def rpc(method, params=None, request_id="1"):
              payload = {"id": request_id, "method": method, "params": params or {}}
              proc.stdin.write(json.dumps(payload) + "\n")
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  raise RuntimeError("No response from backend process.")
              return json.loads(line)

          ping = rpc("ping", request_id="ping-1")
          if not ping.get("ok"):
              raise RuntimeError(f"Ping failed: {ping}")

          shutdown = rpc("shutdown", request_id="shutdown-1")
          if not shutdown.get("ok"):
              raise RuntimeError(f"Shutdown failed: {shutdown}")

          proc.wait(timeout=10)
          if proc.returncode != 0:
              err = proc.stderr.read()
              raise RuntimeError(f"Backend exited with {proc.returncode}: {err}")

          print("Backend stdio smoke test passed.")
          '@
          $tmp = New-TemporaryFile
          Set-Content -Path $tmp -Value $script -Encoding UTF8
          python $tmp
