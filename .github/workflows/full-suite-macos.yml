name: Full Suite macOS

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

jobs:
  full_suite:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make shell scripts executable
        run: |
          chmod +x ./scripts/*.sh
          chmod +x ./scripts/macos/*.sh

      - name: Run full macOS suite
        run: ./scripts/macos/test_all.sh

      - name: Upload full-suite artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-macos
          path: |
            artifacts/test_all/**
            dist/macos/**
          if-no-files-found: warn
