name: Release Windows ZIP

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build app-image + ZIP + checksum
        shell: pwsh
        run: |
          ./scripts/build_v2_release.ps1

      - name: Verify checksums.txt
        shell: pwsh
        run: |
          $checksumPath = "dist_release/checksums.txt"
          if (!(Test-Path $checksumPath)) {
            throw "dist_release/checksums.txt was not generated."
          }

          $line = (Get-Content $checksumPath | Select-Object -First 1).Trim()
          if ([string]::IsNullOrWhiteSpace($line)) {
            throw "checksums.txt is empty."
          }

          $parts = $line -split "\s+\*?", 2
          if ($parts.Count -ne 2) {
            throw "Invalid checksums.txt line format: $line"
          }
          $expectedHash = $parts[0].ToLowerInvariant()
          $zipName = $parts[1]
          $zipPath = Join-Path "dist_release" $zipName

          if (!(Test-Path $zipPath)) {
            throw "ZIP from checksums.txt not found: $zipPath"
          }

          $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "SHA256 mismatch for $zipName. expected=$expectedHash actual=$actualHash"
          }

          Write-Host "Verified SHA256: $zipName"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: transcribemate-windows-release
          path: |
            dist_release/*.zip
            dist_release/checksums.txt
          if-no-files-found: error

  publish_release:
    needs: build_release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: transcribemate-windows-release
          path: dist_release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_release/*.zip
            dist_release/checksums.txt
          generate_release_notes: true
