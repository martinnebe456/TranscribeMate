name: CI Frontend

on:
  workflow_call:
    inputs:
      run_build:
        description: Run the frontend build matrix for this change.
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      run_build:
        description: Run the frontend build matrix.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.run_build }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run frontend tests + build JAR/runtime dependencies
        working-directory: javafx-client
        env:
          TM_PROJECT_ROOT: ${{ github.workspace }}
          TM_RUN_FRONTEND_SMOKE: "false"
        run: |
          mvn -B clean test package dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/dependency
