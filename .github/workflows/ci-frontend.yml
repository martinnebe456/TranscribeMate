name: CI Frontend

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build frontend JAR + runtime dependencies
        working-directory: javafx-client
        run: |
          mvn -B -DskipTests clean package dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/dependency
