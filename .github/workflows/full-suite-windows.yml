name: Full Suite Windows

on:
  workflow_dispatch:
  schedule:
    - cron: "45 2 * * 0"

permissions:
  contents: read

jobs:
  full_suite:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Windows release-to-transcription suite
        shell: pwsh
        run: ./scripts/windows/test_all.ps1

      - name: Upload full-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-windows
          path: |
            artifacts/test_all/windows/**/environment.txt
            artifacts/test_all/windows/**/summary.txt
            artifacts/test_all/windows/**/*.log
            artifacts/test_all/windows/**/fixture-regression/**
            dist/windows/*.zip
            dist/windows/checksums.txt
          if-no-files-found: warn
          retention-days: 14
